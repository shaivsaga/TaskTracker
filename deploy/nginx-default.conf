# This file is included inside http { } — check-nginx.sh wraps it, and on the host
# startup.sh copies it to /etc/nginx/sites-available/default. So only http-context
# directives may appear at the top level here.

map $arg_v $asset_cache {
    default "no-cache";
    "~."    "public, max-age=31536000, immutable";
}

# S3: JS and CSS were served uncompressed (262 KB). text/html is compressed by
# default; these are the types this app actually ships. gzip_proxied any because the
# Azure front end may add a Via header, and the default (off) would then silently
# skip compression on every response behind it.
gzip on;
gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
gzip_min_length 1024;
gzip_vary on;
gzip_comp_level 6;
gzip_proxied any;

# M1: the one password prompt in the app had no throttle at all. 5 requests/minute
# per client IP, 3 allowed to burst. transfer.php has its own PHP-side limiter for
# the public transfer route; this adds the missing nginx-layer counterpart for login
# and does not disturb it. 429 rather than the 503 default, so a throttled login
# does not look like an outage.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php index.html index.htm;
    server_name example.com www.example.com;
    port_in_redirect off;

    # M2: stop advertising the exact nginx version.
    server_tokens off;

    # nginx defaults to 1 MB, which is below the 4 MB board limit in publish.php.
    # Uploads get their own larger limit in the upload.php location below.
    client_max_body_size 5m;

    # ---------------------------------------------------------------------------
    # Security headers (C4, M2).
    #
    # TRAP: nginx does NOT inherit add_header into a location that declares an
    # add_header of its own — the whole server-level set silently disappears there.
    # That is why this block is repeated verbatim in every location below that has
    # its own add_header. Do not "tidy" the repeats away, and do not add a location
    # with its own add_header without copying the full set into it.
    #
    # The two sha256- values are the inline theme and sidebar bootstrap scripts in
    # index.html (lines 19-25 and 26-31). Recompute both if either block is edited,
    # against the LF bytes git actually deploys — hashing a Windows working copy
    # gives the CRLF hash and will not match:
    #   git show HEAD:index.html > /tmp/i.html
    #   printf '%s' '<block contents>' | openssl sha256 -binary | openssl base64
    #
    # HSTS deliberately starts at 300s to leave a rollback window. Raise it to
    # max-age=31536000 and add includeSubDomains once HTTPS is confirmed good.
    # ---------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-KWbP+9nHGPFPEJWFFcRhmqjdu4gYZjQsEPwL6oAs5BY=' 'sha256-lOJ3gbAjoJv9HQYzd5siAhyCBzIzJ9geiMG8rP1+1S8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        index index.php index.html index.htm hostingstart.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # Security header set repeated — add_header does not inherit. See above.
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-KWbP+9nHGPFPEJWFFcRhmqjdu4gYZjQsEPwL6oAs5BY=' 'sha256-lOJ3gbAjoJv9HQYzd5siAhyCBzIzJ9geiMG8rP1+1S8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /50x.html {
        root /html/;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # S2: no-store forced a full 1.70 MB refetch on every visit. no-cache lets the
    # client revalidate against nginx's ETag (mtime+size) and get a 0-byte 304,
    # while a publish still changes the file and so invalidates immediately.
    location = /data/current.json {
        add_header Cache-Control "no-cache" always;
        # Security header set repeated — add_header does not inherit. See above.
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-KWbP+9nHGPFPEJWFFcRhmqjdu4gYZjQsEPwL6oAs5BY=' 'sha256-lOJ3gbAjoJv9HQYzd5siAhyCBzIzJ9geiMG8rP1+1S8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # C1-C3: Azure's wwwroot mount resolves paths case-insensitively, so /Data/ and
    # /DATA/ reach data/ on disk while a case-sensitive ^~ prefix match never fires
    # and the request falls through to the static catch-all instead. Every guard
    # below is therefore a case-insensitive regex (~*).
    #
    # ORDER IS LOAD-BEARING. Regex locations do not chain — only the first match
    # wins — so these two MUST stay above the generic PHP handler near the bottom of
    # this file, or /Tests/php/run.php still reaches PHP-FPM and executes.
    # The exact /data/current.json match above wins regardless of order: nginx checks
    # exact matches before regexes. Do not remove it.
    location ~* ^/(data|deploy|tests)/ {
        deny all;
    }
    location ~* ^/package\.json$ {
        deny all;
    }

    # Regexes containing {32} must be quoted, or nginx reads the brace as a block and refuses to start.
    # Uploaded files: only 32-hex names with an allowed extension, served from data/uploads/.
    # Word and PowerPoint files always download; PDFs and images open in the browser.
    # These are ~* for the same case reason as the denies above (L1): as ~, /Uploads/x.docx
    # fell through to the static catch-all and was served without Content-Disposition.
    location ~* "^/uploads/([a-f0-9]{32}\.(pdf|jpg|png))$" {
        alias /home/site/wwwroot/data/uploads/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Security header set repeated — add_header does not inherit. See above.
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-KWbP+9nHGPFPEJWFFcRhmqjdu4gYZjQsEPwL6oAs5BY=' 'sha256-lOJ3gbAjoJv9HQYzd5siAhyCBzIzJ9geiMG8rP1+1S8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* "^/uploads/([a-f0-9]{32}\.(pptx|docx))$" {
        alias /home/site/wwwroot/data/uploads/$1;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Security header set repeated — add_header does not inherit. See above.
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-KWbP+9nHGPFPEJWFFcRhmqjdu4gYZjQsEPwL6oAs5BY=' 'sha256-lOJ3gbAjoJv9HQYzd5siAhyCBzIzJ9geiMG8rP1+1S8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* ^/(styles\.css|app\.js|qr-draw\.js|qrcode\.js|attachments\.js|logic\.js)$ {
        add_header Cache-Control $asset_cache;
        # Security header set repeated — add_header does not inherit. See above.
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-KWbP+9nHGPFPEJWFFcRhmqjdu4gYZjQsEPwL6oAs5BY=' 'sha256-lOJ3gbAjoJv9HQYzd5siAhyCBzIzJ9geiMG8rP1+1S8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API: exactly five routes. Everything else under /api/ is 404.
    # Only login.php asks for the password. The other four check the session cookie in PHP.
    location = /api/login.php {
        limit_req zone=login burst=3 nodelay;
        auth_basic "TaskTracker admin";
        auth_basic_user_file /home/site/secure/htpasswd;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors off;
    }
    location = /api/logout.php {
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors off;
    }
    location = /api/versions.php {
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors off;
    }
    location = /api/publish.php {
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors off;
    }
    location = /api/upload.php {
        client_max_body_size 12m;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors off;
    }
    # Everything under /api/ that is not one of the five exact routes above is 404.
    # This must stay ~*, not ^~: prefix matching is case-sensitive on Linux, so the previous
    # ^~ /api/ never fired for /Api/login.php. That request fell through to the generic PHP
    # handler below, which sets no REMOTE_USER (so login.php 401s rather than serving anything)
    # but skips both this gate and the login throttle that lives on the exact location.
    # The five exact routes above still win -- nginx checks exact matches before regexes.
    location ~* ^/api/ {
        return 404;
    }

    # Kept last on purpose: the C1-C3 deny regexes above must match first.
    location ~* [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.[Pp][Hh][Pp])(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors off;
    }
}
