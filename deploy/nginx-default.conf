map $arg_v $asset_cache {
    default "no-cache";
    "~."    "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php index.html index.htm;
    server_name example.com www.example.com;
    port_in_redirect off;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        index index.php index.html index.htm hostingstart.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /50x.html {
        root /html/;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /data/current.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /data/ {
        deny all;
    }
    location ^~ /deploy/ {
        deny all;
    }

    location ~* ^/(styles\.css|app\.js|qr-draw\.js|qrcode\.js)$ {
        add_header Cache-Control $asset_cache;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API: exactly four routes. Everything else under /api/ is 404.
    # Only login.php asks for the password. The other three check the session cookie in PHP.
    location = /api/login.php {
        auth_basic "TaskTracker admin";
        auth_basic_user_file /home/site/secure/htpasswd;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors off;
    }
    location = /api/logout.php {
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors off;
    }
    location = /api/versions.php {
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors off;
    }
    location = /api/publish.php {
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors off;
    }
    location ^~ /api/ {
        return 404;
    }

    location ~* [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.[Pp][Hh][Pp])(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors off;
    }
}
