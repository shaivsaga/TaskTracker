<!-- #page-done (#done, two fixture tasks are done here) -->
<section class="page utility-page" id="page-done" data-page-view="done" aria-label="Completed tasks">
  <div class="page-heading">
    <div>
      <p class="page-supporting-copy">Tasks you've marked done on this device.</p>
    </div>
  </div>
  <div class="task-list" id="done-list" aria-label="Completed tasks">
    <div class="task-row done-row is-entering" tabindex="0" style="animation-delay: 320ms;">
      <button type="button" class="status-check is-done" aria-label="Change status">
        <svg class="i" aria-hidden="true">
          <use href="#i-check"></use>
        </svg>
      </button>
      <span class="task-row-title is-done">Warm-up routine chart</span>
      <span class="subject-tag bg-yellow">PE</span>
      <span class="task-row-due">Yesterday, 12:00 PM</span>
      <button type="button" class="text-button">Mark not done</button>
    </div>
    <div class="task-row done-row is-entering" tabindex="0" style="animation-delay: 320ms;">
      <button type="button" class="status-check is-done" aria-label="Change status">
        <svg class="i" aria-hidden="true">
          <use href="#i-check"></use>
        </svg>
      </button>
      <span class="task-row-title is-done">Submit the statistical survey draft</span>
      <span class="subject-tag bg-sand">MABKOM</span>
      <span class="task-row-due">Oct 31, 12:00 PM</span>
      <button type="button" class="text-button">Mark not done</button>
    </div>
  </div>
</section>
