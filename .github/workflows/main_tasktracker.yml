# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - tasktracker

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress


      - name: Validate nginx config
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx && bash deploy/check-nginx.sh

      - name: Run JavaScript tests
        run: node --test tests/*.test.js

      - name: Stamp asset versions
        run: |
          V=${GITHUB_SHA::7}
          sed -i -E "s#styles\.css(\?v=[^\"]*)?\"#styles.css?v=$V\"#; s#qr-draw\.js(\?v=[^\"]*)?\"#qr-draw.js?v=$V\"#; s#attachments\.js(\?v=[^\"]*)?\"#attachments.js?v=$V\"#; s#logic\.js(\?v=[^\"]*)?\"#logic.js?v=$V\"#; s#src=\"app\.js(\?v=[^\"]*)?\"#src=\"app.js?v=$V\"#" index.html
          test "$(grep -c "?v=$V" index.html)" = "5"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F42023E9FF1646DB9B5463177B5D03C2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_615DB0228698475EB32DBD084F50208B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6CE06511D5924C26BC48AC0242C65EB1 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'tasktracker'
          slot-name: 'Production'
          package: .
          